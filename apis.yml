aid: mantl
name: MANTL
description: >-
  MANTL is an account and deposit origination software company for banks and
  credit unions. Its omnichannel platform lets financial institutions open
  consumer and business deposit and loan accounts across online and in-branch
  channels, integrating with existing core banking systems to modernize
  onboarding and accelerate deposit growth. More than 100 institutions raise
  over $1 billion in deposits monthly through the platform. MANTL was surfaced
  as a Techstars portfolio company and added to the API Evangelist network. It
  publishes no public API or developer portal — this profile captures its
  public web, legal, support, and system-status surfaces.
